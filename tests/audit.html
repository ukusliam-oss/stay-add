<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAY ADD. local accessibility audit</title><style>body{font:16px/1.6 system-ui;padding:20px;background:#f0f0e9;color:#111513}iframe{width:100%;height:720px;border:1px solid #aaa}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Local accessibility audit</h1><p>Development-only harness, excluded from the published site. Axe WCAG 2 A/AA, 2.1 AA and 2.2 AA rules.</p><form id="load-form"><label>Page path <input id="path" value="/stay-add/" size="52"></label> <label><input id="no-scripts" type="checkbox"> Block page scripts</label> <button>Load page</button></form><button id="audit">Run accessibility audit</button><pre id="result" role="status">Ready.</pre><iframe src="/stay-add/" title="STAY ADD. prototype"></iframe><script src="/__qa/axe.min.js"></script><script>
document.getElementById('load-form').onsubmit=event=>{event.preventDefault();const frame=document.querySelector('iframe'),blocked=document.getElementById('no-scripts').checked,path=document.getElementById('path').value;if(!path.startsWith('/stay-add/')||path.startsWith('//'))return;if(blocked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');frame.src=path;document.getElementById('audit').disabled=blocked;document.getElementById('result').textContent=blocked?'Page scripts blocked. Inspect the frame body, links, mathematics and disclosures.':'Ready.';};
document.getElementById('audit').onclick=async()=>{const result=document.getElementById('result');result.textContent='Running…';try{const frame=document.querySelector('iframe'); if(!frame.contentWindow.axe){await new Promise((resolve,reject)=>{const script=frame.contentDocument.createElement('script');script.src='/__qa/axe.min.js';script.onload=resolve;script.onerror=reject;frame.contentDocument.head.append(script);});} const report=await frame.contentWindow.axe.run(frame.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});result.textContent=JSON.stringify({path:document.getElementById('path').value,violations:report.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),passes:report.passes.length,incomplete:report.incomplete.map(i=>({id:i.id,nodes:i.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}))},null,2);}catch(error){result.textContent=error.stack;}};
</script></html>
